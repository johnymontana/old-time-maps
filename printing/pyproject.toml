[project]
name = "old-time-maps-printing"
version = "0.1.0"
description = "Printable terrain models from the old-time-maps elevation grids"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.1",
    "scipy>=1.10",
]

[dependency-groups]
qa = [
    "trimesh>=4",
    "lib3mf>=2.4",
]

[tool.uv]
package = false
